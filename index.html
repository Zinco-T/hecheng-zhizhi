<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8e9dc">
  <meta name="description" content="把可爱的之之照片合成起来！移动落点，松手投放，两个相同的之之碰到就会升级。">
  <title>合成之之 · 之之的快乐相册</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ec8d80'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' fill='white'%3E之%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="heading">
      <div class="brand"><span class="brand-flower">✿</span><div><span class="eyebrow">A LITTLE GAME FOR ZHIZHI</span><h1>合成<span>之之</span></h1></div></div>
      <p>相同的之之碰一碰，就有新的惊喜。</p>
    </header>

    <section class="game-panel" aria-label="合成之之游戏">
      <div class="scorebar">
        <div class="score-card"><span>本局分数</span><strong id="score">0</strong></div>
        <div class="score-card"><span>最高分</span><strong id="best">0</strong></div>
        <div class="next-card"><span>下一个</span><img id="next-image" src="assets/level-1.jpg" alt="下一个之之"></div>
        <button class="restart" id="restart" type="button" aria-label="重新开始">↻ <span>重开</span></button>
      </div>

      <div class="playfield" id="playfield">
        <canvas id="game" role="img" aria-label="合成游戏区域。移动鼠标或手指选择位置，点击或松手投放。"></canvas>
        <div class="gameover hidden" id="gameover" role="dialog" aria-modal="true" aria-labelledby="over-title">
          <div class="over-card"><span class="over-flower">✿</span><span class="eyebrow">ONE MORE ROUND?</span><h2 id="over-title">之之堆满啦！</h2><p>再来一次，合成更大的之之吧。</p><div class="over-scores"><div><span>本局分数</span><strong id="final-score">0</strong></div><div><span>最高分</span><strong id="final-best">0</strong></div></div><button id="again" type="button">再来一局 <span>↗</span></button></div>
        </div>
      </div>

      <div class="hint"><span class="hint-icon">☝</span><span>移动选择位置，轻点投放<br><small>键盘 ← → 移动，空格投放</small></span></div>
    </section>

    <section class="evolution" aria-label="合成图鉴"><div class="evolution-title"><span>✦</span> 之之进化图鉴 <span>✦</span></div><div id="evolution-list" class="evolution-list"></div></section>
    <footer>每一种之之，都是独一无二的可爱。 <span>♡</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
